<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo FiveM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bingo-container" class="hidden">
        <div class="header">
            <button id="close-btn">X</button>
            <h1>BINGO</h1>
        </div>

        <div class="main-content">
            <div class="left-panel">
                <div class="info-box">
                    <h3>Prêmio Acumulado</h3>
                    <p id="prize-pool">R$ 0,00</p>
                </div>

                <div class="info-box">
                    <h3>Último Sorteado</h3>
                    <div id="last-number" class="big-number">--</div>
                </div>

                <div class="info-box">
                    <h3>Últimos 5 Números</h3>
                    <ul id="drawn-history">
                        <!-- Preenchido via JS -->
                    </ul>
                </div>

                <button id="buy-btn" class="action-btn">Comprar Cartela (R$ 500)</button>
                <button id="bingo-btn" class="action-btn" disabled>BINGO!</button>
            </div>

            <div class="ticket-panel">
                <div class="bingo-header-row">
                    <div class="letter">B</div>
                    <div class="letter">I</div>
                    <div class="letter">N</div>
                    <div class="letter">G</div>
                    <div class="letter">O</div>
                </div>
                <div id="ticket-grid" class="grid-5x5">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
